name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  toolchain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ hashFiles('docker/Dockerfile') }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/slam-ci:$TAG"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for i in $(seq 30); do
            docker pull "$IMAGE" && exit 0
            echo "image not available yet ($i/30); waiting for image.yml"; sleep 60
          done
          echo "::error::$IMAGE never appeared; check the image.yml workflow run"
          exit 1
      - name: Print the tool versions
        run: |
          docker run --rm "$IMAGE" bash -c '
            cmake --version | head -1 && g++-12 --version | head -1 && colcon --help > /dev/null && doxygen --version | head -1'
  core-no-ros:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-12 libeigen3-dev libgtest-dev git
      - name: Build and test the core without ROS
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S src/slam_cpp -B build -DSLAM_BUILD_TOOLS=ON -DBUILD_TESTING=ON
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Compile each header alone
        run: |
          for h in src/slam_cpp/include/slam_cpp/*.hpp; do
            echo "$h"
            g++-12 -std=c++17 -fsyntax-only -Isrc/slam_cpp/include -I/usr/include/eigen3 -x c++ "$h" || exit 1
          done
